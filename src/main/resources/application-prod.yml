spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=app,public
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        api-key: ${OPENAI_API_KEY}
        options:
          model: text-embedding-3-small
          dimensions: 384
          encodingFormat: float

  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: app

  flyway:
    schemas: app
    default-schema: app
    create-schemas: true
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    redirect-success: ${APP_AUTH_REDIRECT_SUCCESS}
    redirect-failure: ${APP_AUTH_REDIRECT_FAILURE}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR}

logging:
  level:
    root: INFO
    com.chaean.teamchatsa: INFO

server:
  forward-headers-strategy: framework

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}
    enabled: ${SLACK_ALERT_ENABLED}
  alert:
    channel: "#alert"
    username: "TeamChatSa Bot"
    icon-emoji: ":rotating_light:"
